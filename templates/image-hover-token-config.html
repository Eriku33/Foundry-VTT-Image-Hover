<div class="form-group">
	<label>Hide Image Hover Art</label>
	<input type="checkbox" name="flags.image-hover.hideArt" {{hideHoverStatus}}>
</div>
<div class="form-group">
	<label>Art on hover</label>
	<div class="form-fields">
	    <select name="flags.image-hover.artType">
	        {{selectOptions artTypeChoices selected=artTypeStatus}}
	    </select>
	</div>
	<p class="hint">"Default" uses the world setting. Any other option overrides it for this token only.</p>
</div>
<div class="form-group">
	<label>Specific image on hover</label>
	<div class="form-fields">
	    <input class="specific-image-hover" type="text" name="flags.image-hover.specificArt" value={{specificArtStatus}}>
	    <button type="button" class="image-hover-picker-button" data-type="imagevideo">
        	<i class="fas fa-file-import fa-fw"></i>
            </button>
        </div>
</div>
